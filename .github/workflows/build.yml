name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Check the internet relay still behaves as Relay expects
        continue-on-error: true
        run: gradle testReleaseUnitTest --no-daemon -i | grep -E "ntfy|HTTP|PASSED|FAILED|round trip|->" || true
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk Relay.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Relay
          path: Relay.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Relay.apk \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Relay build ${{ github.run_number }}" --notes "Install Relay.apk on both devices."
